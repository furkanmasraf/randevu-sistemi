version: '3.8'

services:
  # PostgreSQL Veritabanı Servisi
  db:
    image: postgres:15-alpine
    container_name: barber_postgres_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: barber_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - barber_network

  # Redis Önbellek Servisi
  redis:
    image: redis:7-alpine
    container_name: barber_redis
    ports:
      - "6379:6379"
    restart: always
    networks:
      - barber_network

  # Spring Boot Backend Servisi (Yeni Eklenen)
  backend:
    build: .
    container_name: barber_backend
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=db       # PostgreSQL servis adın (db) ile birebir aynı olmalı
      - DB_PORT=5432
      - REDIS_HOST=redis # Redis servis adın (redis) ile birebir aynı olmalı
      - REDIS_PORT=6379
    depends_on:
      - db
      - redis
    networks:
      - barber_network

volumes:
  postgres_data:

networks:
  barber_network:
    driver: bridge